    <script type="application/ld+json" id="schema-ld">
      {
        "@context": "https://schema.org",
        "@type": ["WebApplication", "SoftwareApplication"],
        "@id": "https://zone.esl.kz/#app",
        "name": "Белый шум",
        "alternateName": "Зона",
        "url": "https://zone.esl.kz/",
        "description": "Спокойные звуки. Наложи несколько — слушай свой микс.",
        "applicationCategory": "MultimediaApplication",
        "operatingSystem": "Any",
        "inLanguage": "ru",
        "browserRequirements": "Requires JavaScript. Requires HTML5.",
        "image": "https://zone.esl.kz/icons/icon-512.png",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "KZT"
        },
        "featureList": [
          "Микшер звуков природы",
          "Пресеты и избранное",
          "Таймер сна",
          "Офлайн PWA"
        ]
      }
    </script>
    <script>
      try {
        var theme = localStorage.getItem('zone.theme');
        if (theme === 'dark' || theme === 'light') {
          document.documentElement.dataset.theme = theme;
        }
      } catch (e) {}
    </script>
    <script>
      (function () {
        var VER = 'chrome-layout-v9';
        try {
          if (localStorage.getItem('zone.chrome') === VER) return;
          localStorage.setItem('zone.chrome', VER);
        } catch (e) {}
        var reload = function () {
          location.replace(location.pathname + location.search + location.hash);
        };
        var chain = Promise.resolve();
        if ('serviceWorker' in navigator) {
          chain = navigator.serviceWorker.getRegistrations().then(function (regs) {
            return Promise.all(regs.map(function (r) { return r.unregister(); }));
          });
        }
        chain
          .then(function () {
            if (!('caches' in window)) return;
            return caches.keys().then(function (keys) {
              return Promise.all(keys.map(function (k) { return caches.delete(k); }));
            });
          })
          .then(reload)
          .catch(reload);
      })();
    </script>
